<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planner Semanal da Luziana</title>

<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#c9797f">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--rose:#c9797f;
--wine:#7d3039;
--cream:#fbf5ef;
--white:#ffffff;
--line:#ead9d1;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--cream);
font-family:Montserrat,sans-serif;
color:#493338;
}

.topbar{
background:#fff;
padding:25px 35px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.logo h1{
font-family:"Cormorant Garamond",serif;
font-size:42px;
color:var(--wine);
}

.logo span{
display:block;
margin-top:6px;
color:#9d7075;
}

.install-btn{
background:var(--rose);
color:#fff;
border:none;
padding:12px 22px;
border-radius:30px;
font-weight:600;
cursor:pointer;
}

.days-nav{
background:#fff;
display:flex;
justify-content:center;
gap:12px;
padding:18px;
border-bottom:1px solid var(--line);
}

.day{
padding:10px 20px;
border-radius:30px;
border:1px solid #e7cfc7;
background:#fff;
cursor:pointer;
font-weight:600;
transition:.25s;
}

.day.active{
background:var(--rose);
color:#fff;
border-color:var(--rose);
}

#app{
max-width:1000px;
margin:40px auto;
padding:20px;
}

.cover{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.cover img{
width:100%;
display:block;
border-radius:16px;
}
.planner{

background:white;

border-radius:20px;

padding:30px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.planner h2{

font-family:"Cormorant Garamond",serif;

font-size:40px;

color:var(--wine);

margin-bottom:25px;

text-align:center;

}

.task{

display:flex;

align-items:center;

padding:14px 16px;

margin-bottom:12px;

border-radius:14px;

border:1px solid #ead9d1;

transition:.25s;

background:#fffdfc;

}

.task:hover{

background:#fff3f4;

}

.task input{

width:22px;

height:22px;

margin-right:16px;

cursor:pointer;

accent-color:#c9797f;

}

.task span{

font-size:17px;

font-weight:500;

}

.progress{

height:14px;

background:#ead9d1;

border-radius:30px;

overflow:hidden;

margin:25px 0;

}

.progress-bar{

height:100%;

width:0%;

background:#c9797f;

transition:.4s;

border-radius:30px;

}

.percent{

text-align:center;

font-weight:bold;

color:#7d3039;

margin-bottom:15px;

}
</style>

</head>

<body>

<header class="topbar">

<div class="logo">
<h1>Planner Semanal da Luziana</h1>
<span>Organize sua semana com leveza 🌷</span>
</div>

<button class="install-btn" id="installBtn">
Instalar App
</button>

</header>

<nav class="days-nav">

<button class="day active" data-day="capa">Capa</button>
<button class="day" data-day="segunda">Segunda</button>
<button class="day" data-day="terca">Terça</button>
<button class="day" data-day="quarta">Quarta</button>
<button class="day" data-day="quinta">Quinta</button>
<button class="day" data-day="sexta">Sexta</button>
<button class="day" data-day="historico">Histórico</button>

</nav>

<main id="app">

</main>
<script>

const paginas = {

capa: `
<div class="cover">
<img src="assets/cover.png" alt="Capa do Planner">
</div>
`,

segunda: `
segunda: `
<div class="planner">

<h2>🌷 Segunda-feira</h2>

<div class="percent">
0% concluído
</div>

<div class="progress">
<div class="progress-bar"></div>
</div>

<div class="task">
<label><input type="checkbox"><span>Acordar</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Higiene pessoal</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Café da manhã</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Arrumar a cama</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Meditar na Palavra</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Treino</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Banho</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Trabalho</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Jantar</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Tempo livre</span></label>
</div>

</div>
`,

terca: `
<h2>🌷 Terça-feira</h2>
<p>Em construção...</p>
`,

quarta: `
<h2>🌷 Quarta-feira</h2>
<p>Em construção...</p>
`,

quinta: `
<h2>🌷 Quinta-feira</h2>
<p>Em construção...</p>
`,

sexta: `
<h2>🌷 Sexta-feira</h2>
<p>Em construção...</p>
`,

historico: `
<h2>📚 Histórico</h2>
<p>Em construção...</p>
`

};

const app = document.getElementById("app");

function abrirPagina(nome){

app.innerHTML = paginas[nome];

document.querySelectorAll(".day").forEach(botao=>{
botao.classList.remove("active");
});

const ativo = document.querySelector(`[data-day="${nome}"]`);

if(ativo){
ativo.classList.add("active");
}

}

document.querySelectorAll(".day").forEach(botao=>{

botao.addEventListener("click",()=>{

abrirPagina(botao.dataset.day);

});

});

abrirPagina("capa");
console.log("INDEX NOVO CARREGADO");
</script>

</body>

</html>
