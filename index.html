<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c9797f">
<title>Planner Semanal da Luziana</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --rosa:#c9797f;--rosa-claro:#f3d9db;--vinho:#7d3039;
  --creme:#fbf5ef;--branco:#fff;--texto:#4b3435;
  --sombra:0 4px 15px rgba(90,40,40,.12)
}
body{font-family:Arial,sans-serif;background:var(--creme);color:var(--texto);min-height:100vh}
header{background:linear-gradient(135deg,var(--vinho),var(--rosa));color:white;padding:28px 18px 24px;text-align:center;border-radius:0 0 28px 28px;box-shadow:var(--sombra)}
header h1{font-size:25px;margin-bottom:7px}
header p{font-size:14px;opacity:.92}
.container{max-width:650px;margin:auto;padding:18px 14px 40px}
.topo{display:flex;gap:10px;margin-bottom:15px}
button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:bold;cursor:pointer}
.topo button{flex:1}.btn{background:var(--rosa);color:white}
.btn-sec{background:white;color:var(--vinho);border:1px solid var(--rosa-claro)}
.data{text-align:center;font-weight:bold;color:var(--vinho);margin:8px 0 18px;font-size:20px}
.dia{background:white;border-radius:22px;margin-bottom:15px;padding:16px;box-shadow:var(--sombra);border-left:6px solid var(--rosa)}
.dia h2{color:var(--vinho);font-size:20px;margin-bottom:12px}
.tarefa{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f0e4df}
.tarefa:last-child{border-bottom:0}
.tarefa input[type=checkbox]{width:21px;height:21px;accent-color:var(--rosa);flex-shrink:0}
.tarefa span{flex:1;font-size:15px;line-height:1.35}
.concluida span{text-decoration:line-through;opacity:.5}
.excluir{background:#f7e5e5;color:#9b4149;padding:6px 9px;font-size:13px}
.adicionar{display:flex;gap:7px;margin-top:10px}
.adicionar input{flex:1;min-width:0;border:1px solid #e6cccc;border-radius:10px;padding:11px;font-size:14px;outline:none}
.adicionar button{padding:10px 13px;background:var(--vinho);color:white}
.vazio{text-align:center;padding:16px;color:#7d5b5d}
.notas{background:#fffaf4;border:1px solid #ead7ca;border-radius:20px;padding:17px;margin-top:18px;box-shadow:var(--sombra)}
.notas h2{color:var(--vinho);font-size:20px;margin-bottom:10px}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid #e6cccc;border-radius:12px;padding:12px;font-size:15px;background:white;color:var(--texto);outline:none}
.resumo{margin-top:18px;background:var(--rosa-claro);border-radius:18px;padding:20px;text-align:center;color:var(--vinho)}
.resumo strong{display:block;font-size:28px;margin:5px}
.barra{height:16px;background:white;border-radius:20px;overflow:hidden;margin:14px 0}
.progresso{height:100%;width:0;background:var(--vinho);transition:.3s}
footer{text-align:center;padding:10px 20px 30px;color:#8b7071;font-size:14px;line-height:1.5}
@media(max-width:480px){header h1{font-size:24px}.data{font-size:18px}.dia h2{font-size:19px}}
</style>
</head>
<body>
<header>
<h1>🌸 Planner Semanal da Luziana</h1>
<p>Uma rotina organizada, leve e feita com carinho.</p>
</header>

<main class="container">
<div class="topo">
<button class="btn" onclick="irParaHoje()">📅 Ir para hoje</button>
<button class="btn-sec" onclick="limparConcluidas()">🧹 Limpar concluídas</button>
</div>

<div id="dataAtual" class="data"></div>
<div id="dias"></div>

<section class="notas">
<h2>📝 Minhas anotações</h2>
<textarea id="notas" placeholder="Escreva aqui seus lembretes, ideias ou observações..."></textarea>
</section>

<section class="resumo">
<div>Progresso da semana</div>
<strong id="percentual">0%</strong>
<div class="barra"><div id="barraProgresso" class="progresso"></div></div>
<div id="contador">0 de 0 tarefas concluídas</div>
</section>
</main>

<footer>
Os quadradinhos e suas anotações são salvos neste aparelho. 🌷
</footer>

<script>
const tarefasIniciais = {
"Domingo": [],
"Segunda-feira": [
"10:00 – Acordar",
"10:00 – 10:20 – Higiene pessoal",
"10:20 – 10:50 – ☕ Café da manhã",
"10:50 – 11:10 – 🛏️ Arrumar a cama e organizar o quarto",
"11:10 – 13:00 – 🍽️ Ajudar a preparar o almoço e almoçar",
"13:00 – 13:30 – 🙏 Meditar na Palavra",
"13:30 – 14:00 – 🧹 Varrer a casa",
"14:00 – 15:00 – 💪 Treino",
"15:00 – 15:30 – 🚿 Banho",
"15:30 – 19:00 – 💼 Trabalho",
"19:00 – 20:00 – 🍽️ Jantar",
"20:00 – 21:30 – 💼 Trabalhar mais um pouquinho",
"21:30 em diante – 🌙 Tempo livre, lazer ou leitura",
"00:00 – 😴 Dormir"
],
"Terça-feira": [
"10:00 – Acordar",
"10:00 – 10:20 – Higiene pessoal",
"10:20 – 10:50 – ☕ Café da manhã",
"10:50 – 11:10 – 🛏️ Arrumar a cama e organizar o quarto",
"11:10 – 13:00 – 🍽️ Ajudar a preparar o almoço e almoçar",
"13:00 – 13:30 – 🙏 Meditar na Palavra",
"13:30 – 14:00 – 👕 Colocar roupa para lavar",
"14:00 – 15:00 – 💪 Treino",
"15:00 – 15:30 – 🚿 Banho",
"15:30 – 16:00 – 🧺 Estender a roupa no varal (ou colocar na secadora, se necessário)",
"16:00 – 19:00 – 💼 Trabalho",
"19:00 – 20:00 – 🍽️ Jantar",
"20:00 – 21:30 – 💼 Trabalhar mais um pouquinho",
"21:30 em diante – 🌙 Tempo livre, lazer ou leitura",
"00:00 – 😴 Dormir"
],
"Quarta-feira": [
"10:00 – Acordar",
"10:00 – 10:20 – Higiene pessoal",
"10:20 – 10:50 – ☕ Café da manhã",
"10:50 – 11:10 – 🛏️ Arrumar a cama e organizar o quarto",
"11:10 – 13:00 – 🍽️ Ajudar a preparar o almoço e almoçar",
"13:00 – 13:30 – 🙏 Meditar na Palavra",
"13:30 – 14:00 – 👕 Dobrar e guardar as roupas",
"14:00 – 14:20 – 🧴 Limpar a estante",
"14:20 – 14:40 – 🍽️ Arrumar a mesa",
"14:40 – 15:40 – 💪 Treino",
"15:40 – 16:00 – 🚿 Banho",
"16:00 – 19:00 – 💼 Trabalho",
"19:00 – 20:00 – 🍽️ Jantar",
"20:00 – 21:30 – 💼 Trabalhar mais um pouquinho",
"21:30 em diante – 🌙 Tempo livre, lazer ou leitura",
"00:00 – 😴 Dormir"
],
"Quinta-feira": [
"10:00 – Acordar",
"10:00 – 10:20 – Higiene pessoal",
"10:20 – 10:50 – ☕ Café da manhã",
"10:50 – 11:10 – 🛏️ Arrumar a cama e organizar o quarto",
"11:10 – 13:00 – 🍽️ Ajudar a preparar o almoço e almoçar",
"13:00 – 13:30 – 🙏 Meditar na Palavra",
"13:30 – 14:00 – 🍳 Organizar as panelas no armário",
"14:00 – 15:00 – 💪 Treino",
"15:00 – 15:30 – 🚿 Banho e lavar o cabelo",
"15:30 – 16:15 – 💅 Fazer as unhas",
"16:15 – 19:00 – 💼 Trabalho",
"19:00 – 20:00 – 🍽️ Jantar",
"20:00 – 21:30 – 💼 Trabalhar mais um pouquinho",
"21:30 em diante – 🌙 Tempo livre, lazer ou leitura",
"00:00 – 😴 Dormir"
],
"Sexta-feira": [
"10:00 – Acordar",
"10:00 – 10:20 – Higiene pessoal",
"10:20 – 10:50 – ☕ Café da manhã",
"10:50 – 11:10 – 🛏️ Arrumar a cama e organizar o quarto",
"11:10 – 13:00 – 🍽️ Ajudar a preparar o almoço e almoçar",
"13:00 – 13:30 – 🙏 Meditar na Palavra",
"13:30 – 14:15 – 🧹 Limpeza geral da casa: varrer (se necessário), passar pano e organizar os ambientes",
"14:15 – 14:45 – 💄 Organizar o cantinho de autocuidado: perfumes, cremes, joias e acessórios, maquiagens (se necessário)",
"14:45 – 15:00 – ☕ Pausa para um café",
"15:00 – 19:00 – 💼 Trabalho",
"19:00 – 20:00 – 🍽️ Jantar",
"20:00 – 21:30 – 💼 Trabalhar mais um pouquinho",
"21:30 em diante – 🌙 Tempo livre, lazer ou um filme",
"00:00 – 😴 Dormir"
],
"Sábado": []
};

const chave="plannerLuzianaV2";
let dados=JSON.parse(localStorage.getItem(chave)||"null");
if(!dados){
  dados=Object.fromEntries(Object.entries(tarefasIniciais).map(([dia,lista])=>[dia,lista.map(texto=>({texto,feito:false}))]));
}

const diasOrdem=Object.keys(tarefasIniciais);

function salvar(){localStorage.setItem(chave,JSON.stringify(dados));}
function escapar(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

function render(){
  const area=document.getElementById("dias");
  area.innerHTML="";
  diasOrdem.forEach(dia=>{
    const sec=document.createElement("section");
    sec.className="dia";
    sec.id="dia-"+dia;
    sec.innerHTML=`<h2>🌷 ${dia}</h2>`;
    if(!dados[dia].length) sec.innerHTML+=`<div class="vazio">Nenhuma tarefa adicionada ainda.</div>`;
    dados[dia].forEach((t,i)=>{
      const div=document.createElement("div");
      div.className="tarefa"+(t.feito?" concluida":"");
      div.innerHTML=`<input type="checkbox" ${t.feito?"checked":""} onchange="marcar('${dia}',${i},this.checked)">
      <span>${escapar(t.texto)}</span><button class="excluir" onclick="excluir('${dia}',${i})">Excluir</button>`;
      sec.appendChild(div);
    });
    const add=document.createElement("div");
    add.className="adicionar";
    add.innerHTML=`<input id="input-${dia}" placeholder="Adicionar tarefa..." onkeydown="if(event.key==='Enter')adicionar('${dia}')">
    <button onclick="adicionar('${dia}')">+ Adicionar</button>`;
    sec.appendChild(add);
    area.appendChild(sec);
  });
  atualizarResumo();
}

function adicionar(dia){
  const input=document.getElementById("input-"+dia);
  const texto=input.value.trim();
  if(!texto)return;
  dados[dia].push({texto,feito:false});
  input.value=""; salvar(); render();
}
function marcar(dia,i,feito){dados[dia][i].feito=feito;salvar();render();}
function excluir(dia,i){dados[dia].splice(i,1);salvar();render();}
function limparConcluidas(){
  diasOrdem.forEach(dia=>dados[dia]=dados[dia].filter(t=>!t.feito));
  salvar();render();
}
function atualizarResumo(){
  let total=0,feitas=0;
  diasOrdem.forEach(d=>dados[d].forEach(t=>{total++;if(t.feito)feitas++}));
  const p=total?Math.round(feitas/total*100):0;
  document.getElementById("percentual").textContent=p+"%";
  document.getElementById("barraProgresso").style.width=p+"%";
  document.getElementById("contador").textContent=`${feitas} de ${total} tarefas concluídas`;
}
function irParaHoje(){
  const nomes=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
  const nome=nomes[new Date().getDay()];
  document.getElementById("dia-"+nome)?.scrollIntoView({behavior:"smooth",block:"start"});
}
function mostrarData(){
  const hoje=new Date();
  document.getElementById("dataAtual").textContent=hoje.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
document.getElementById("notas").value=localStorage.getItem("notasLuziana")||"";
document.getElementById("notas").addEventListener("input",e=>localStorage.setItem("notasLuziana",e.target.value));
mostrarData();render();
</script>
</body>
</html>
