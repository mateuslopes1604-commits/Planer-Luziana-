@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@500;600&display=swap');

:root{
  --rose:#c9797f;
  --wine:#7d3039;
  --gold:#c28b36;
  --cream:#fbf5ef;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:#493338}
body{font-family:Montserrat,system-ui,sans-serif}

.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(251,245,239,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(194,139,54,.25);
  padding:10px 12px 8px;
  box-shadow:0 4px 18px rgba(80,45,45,.06)
}
.brand{
  display:flex;justify-content:space-between;align-items:center;
  max-width:1050px;margin:auto;gap:10px
}
.brand-title{
  font-family:"Cormorant Garamond",serif;
  color:var(--wine);font-size:23px;font-weight:700
}
.install{
  display:none;border:1px solid var(--gold);
  background:#fffaf6;color:var(--wine);
  border-radius:999px;padding:8px 12px;
  font-weight:600;font-size:12px
}
.tabs{
  max-width:1050px;margin:8px auto 0;
  display:flex;gap:6px;overflow:auto;scrollbar-width:none
}
.tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex:0 0 auto;border:1px solid #e8cfc5;
  background:#fffaf6;color:#8c4a52;
  border-radius:999px;padding:7px 12px;
  font-size:12px;font-weight:600
}
.day-tab.active{
  background:var(--rose);color:#fff;border-color:var(--rose)
}
main{padding:16px 10px 30px}
.page{display:none;max-width:1050px;margin:auto}
.page.active{display:block}
.page-art{
  position:relative;width:min(100%,1024px);
  margin:auto;line-height:0
}
.page-art img{
  display:block;width:100%;height:auto;
  border-radius:10px;
  box-shadow:0 12px 35px rgba(79,42,42,.10)
}
.hitboxes{position:absolute;inset:0}
.hitbox{
  position:absolute;transform:translate(-50%,-50%);
  width:48px;height:48px;border:0;border-radius:10px;
  background:transparent;cursor:pointer;padding:0
}
.hitbox::after{
  content:"";position:absolute;inset:6px;
  border:2px solid transparent;border-radius:5px
}
.hitbox.checked::after{
  border-color:var(--rose);
  background:rgba(255,255,255,.74)
}
.hitbox.checked::before{
  content:"✓";position:absolute;z-index:2;
  left:50%;top:50%;
  transform:translate(-50%,-55%);
  color:var(--rose);font-weight:800;
  font-size:22px;line-height:1
}
.completion{
  position:absolute;left:50%;bottom:2.7%;
  transform:translateX(-50%);
  font-size:11px;color:#a66b69;
  background:rgba(255,250,246,.9);
  padding:4px 10px;border-radius:999px;
  display:none
}
.footer{
  text-align:center;color:#9b7272;
  font-size:11px;padding:10px 0 24px
}
@media(min-width:700px){
  main{padding:24px 20px 40px}
  .brand-title{font-size:25px}
  .hitbox{width:56px;height:56px}
}

<script>
/*
  IMPORTANTE:
  A pasta continua se chamando "assets".
  Não é "ativos" e não precisa ser renomeada.
  Os nomes dos arquivos de imagem também continuam como já estavam.
*/

const DAYS = {
  segunda: 13,
  terca: 14,
  quarta: 15,
  quinta: 14,
  sexta: 13
};

const STATE_KEY = "planner-luziana-state-v2";
const WEEK_KEY = "planner-luziana-week-v2";

/* Calcula a semana atual.
   Quando a semana mudar, os checkboxes são zerados automaticamente. */
function weekKey(date = new Date()) {
  const x = new Date(Date.UTC(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  ));

  const day = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - day);

  const year = x.getUTCFullYear();
  const start = new Date(Date.UTC(year, 0, 1));

  const week = Math.ceil(
    ((((x - start) / 86400000) + 1) / 7)
  );

  return year + "-W" + String(week).padStart(2, "0");
}

function loadState() {
  const currentWeek = weekKey();
  const savedWeek = localStorage.getItem(WEEK_KEY);

  if (savedWeek !== currentWeek) {
    localStorage.setItem(WEEK_KEY, currentWeek);
    localStorage.setItem(STATE_KEY, "{}");
    return {};
  }

  try {
    return JSON.parse(
      localStorage.getItem(STATE_KEY) || "{}"
    );
  } catch {
    return {};
  }
}

let state = loadState();

function saveState() {
  localStorage.setItem(
    STATE_KEY,
    JSON.stringify(state)
  );
}

function render() {
  document.querySelectorAll(".day-page").forEach(page => {
    const day = page.dataset.day;
    const saved = state[day] || {};
    const buttons = page.querySelectorAll(".hitbox");

    buttons.forEach((button, index) => {
      const checked = !!saved[index];

      button.classList.toggle("checked", checked);
      button.setAttribute(
        "aria-pressed",
        checked ? "true" : "false"
      );
    });

    const done = Object.values(saved)
      .filter(Boolean).length;

    const completion =
      document.getElementById("completion-" + day);

    if (done === DAYS[day]) {
      completion.style.display = "block";
      completion.textContent = "Dia concluído ✦";
    } else {
      completion.style.display = "none";
      completion.textContent = "";
    }
  });
}

/* Marcar/desmarcar tarefas */
document.querySelectorAll(".hitbox").forEach(button => {
  button.addEventListener("click", () => {
    const day =
      button.closest(".day-page").dataset.day;

    const task =
      Number(button.dataset.task);

    state[day] = state[day] || {};
    state[day][task] = !state[day][task];

    saveState();
    render();
  });
});

/* Trocar de página/dia */
document.querySelectorAll(".day-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document
      .querySelectorAll(".day-tab")
      .forEach(item => item.classList.remove("active"));

    tab.classList.add("active");

    document
      .querySelectorAll(".page")
      .forEach(page => page.classList.remove("active"));

    document
      .getElementById("page-" + tab.dataset.page)
      .classList.add("active");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
});

render();

/* Instalação como aplicativo */
let deferredPrompt;
const installBtn =
  document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  deferredPrompt = event;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  await deferredPrompt.userChoice;

  deferredPrompt = null;
  installBtn.style.display = "none";
});

/* Atualização automática do aplicativo */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./sw.js")
      .catch(() => {});
  });
}
</script>
