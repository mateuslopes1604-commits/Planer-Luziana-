<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Planner Semanal da Luziana</title>

<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#c9797f">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{

--rose:#c9797f;
--wine:#7d3039;
--cream:#fbf5ef;
--gold:#c28b36;
--white:#ffffff;
--line:#ead9d1;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:var(--cream);

font-family:Montserrat,sans-serif;

color:#493338;

}

.topbar{

padding:25px;

background:white;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 4px 20px rgba(0,0,0,.05);

}

.logo h1{

font-family:"Cormorant Garamond",serif;

font-size:38px;

color:var(--wine);

}

.logo span{

display:block;

margin-top:5px;

color:#9d7075;

font-size:14px;

}

.install-btn{

background:var(--rose);

color:white;

border:none;

padding:12px 22px;

border-radius:30px;

cursor:pointer;

font-weight:600;

}

.days-nav{

display:flex;

gap:10px;

padding:20px;

justify-content:center;

flex-wrap:wrap;

background:white;

border-bottom:1px solid var(--line);

}

.day{

padding:10px 18px;

border-radius:25px;

border:1px solid #e7cfc7;

background:white;

cursor:pointer;

font-weight:600;

transition:.25s;

}

.day.active{

background:var(--rose);

color:white;

border-color:var(--rose);

}

#app{

max-width:1000px;

margin:35px auto;

padding:20px;

}
</style>

</head>

<header class="topbar">

    <div class="logo">
        <h1>Planner Semanal da Luziana</h1>
        <span>Organize sua semana com leveza 🌷</span>
    </div>

    <button id="installBtn" class="install-btn">
        Instalar App
    </button>

</header>

<nav class="days-nav">

    <button class="day active" data-day="segunda">Segunda</button>

    <button class="day" data-day="terca">Terça</button>

    <button class="day" data-day="quarta">Quarta</button>

    <button class="day" data-day="quinta">Quinta</button>

    <button class="day" data-day="sexta">Sexta</button>

    <button class="day" data-day="historico">Histórico</button>

</nav>

<main id="app">

</main>
<header>

<h1>
Planner Semanal da Luziana
</h1>

</header>

<main>

</main>

<script>

</script>

</body>

</html>
