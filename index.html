<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c9797f">

<title>Planner Semanal da Luziana</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --rosa:#c9797f;
  --rosa-claro:#f3d9db;
  --vinho:#7d3039;
  --creme:#fbf5ef;
  --branco:#ffffff;
  --texto:#4b3435;
  --dourado:#c28b36;
  --sombra:0 4px 15px rgba(90,40,40,.12);
}

body{
  font-family:Arial,sans-serif;
  background:var(--creme);
  color:var(--texto);
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,var(--vinho),var(--rosa));
  color:white;
  padding:28px 18px 24px;
  text-align:center;
  border-radius:0 0 28px 28px;
  box-shadow:var(--sombra);
}

header h1{
  font-size:25px;
  margin-bottom:7px;
}

header p{
  font-size:14px;
  opacity:.92;
}

.container{
  max-width:650px;
  margin:auto;
  padding:18px 14px 40px;
}

.topo{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.topo button{
  flex:1;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:var(--rosa);
  color:white;
}

.btn-sec{
  background:white;
  color:var(--vinho);
  border:1px solid var(--rosa-claro);
}

.data{
  text-align:center;
  font-weight:bold;
  color:var(--vinho);
  margin:8px 0 18px;
}

.dia{
  background:white;
  border-radius:20px;
  margin-bottom:15px;
  padding:16px;
  box-shadow:var(--sombra);
  border-left:5px solid var(--rosa);
}

.dia h2{
  color:var(--vinho);
  font-size:19px;
  margin-bottom:12px;
}

.tarefa{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid #f0e4df;
}

.tarefa:last-child{
  border-bottom:0;
}

.tarefa input[type="checkbox"]{
  width:20px;
  height:20px;
  accent-color:var(--rosa);
}

.tarefa span{
  flex:1;
  font-size:15px;
}

.concluida span{
  text-decoration:line-through;
  opacity:.5;
}

.excluir{
  background:#f7e5e5;
  color:#9b4149;
  padding:6px 9px;
  font-size:13px;
}

.adicionar{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.adicionar input{
  flex:1;
  min-width:0;
  border:1px solid #e6cccc;
  border-radius:10px;
  padding:11px;
  font-size:14px;
  outline:none;
}

.adicionar button{
  padding:10px 13px;
  background:var(--vinho);
  color:white;
}

.notas{
  background:#fffaf4;
  border:1px solid #ead7ca;
  border-radius:20px;
  padding:17px;
  margin-top:18px;
  box-shadow:var(--sombra);
}

.notas h2{
  color:var(--vinho);
  font-size:19px;
  margin-bottom:10px;
}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  border:1px solid #e6cccc;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  background:white;
  color:var(--texto);
  outline:none;
}

.resumo{
  margin-top:18px;
  background:var(--rosa-claro);
  border-radius:18px;
  padding:16px;
  text-align:center;
  color:var(--vinho);
}

.resumo strong{
  font-size:20px;
}

footer{
  text-align:center;
