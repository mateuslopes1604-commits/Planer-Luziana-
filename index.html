<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c9797f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner Luziana">

<title>Planner Semanal da Luziana</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --rosa:#c9797f;
  --rosa-claro:#f3d9db;
  --vinho:#7d3039;
  --creme:#fbf5ef;
  --branco:#ffffff;
  --texto:#4b3435;
  --verde:#6f8b72;
  --sombra:0 4px 15px rgba(90,40,40,.12);
}

body{
  font-family:Arial,sans-serif;
  background:var(--creme);
  color:var(--texto);
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,var(--vinho),var(--rosa));
  color:white;
  padding:28px 18px 24px;
  text-align:center;
  border-radius:0 0 28px 28px;
  box-shadow:var(--sombra);
}

header h1{
  font-size:25px;
  margin-bottom:7px;
}

header p{
  font-size:14px;
  opacity:.92;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px 14px 40px;
}

.topo{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}

.topo button{
  flex:1;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:var(--rosa);
  color:white;
}

.btn-sec{
  background:white;
  color:var(--vinho);
  border:1px solid var(--rosa-claro);
}

.semana{
  text-align:center;
  font-weight:bold;
  color:var(--vinho);
  margin:10px 0 18px;
  font-size:13px;
}

.dia{
  background:white;
  border-radius:20px;
  margin-bottom:16px;
  padding:16px;
  box-shadow:var(--sombra);
  border-left:5px solid var(--rosa);
}

.dia h2{
  color:var(--vinho);
  font-size:20px;
  margin-bottom:5px;
}

.dia-subtitulo{
  color:#927273;
  font-size:12px;
  margin-bottom:10px;
}

.tarefa{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #f0e4df;
}

.tarefa:last-of-type{
  border-bottom:0;
}

.tarefa input[type="checkbox"]{
  width:21px;
  height:21px;
  margin-top:1px;
  flex:0 0 auto;
  accent-color:var(--rosa);
}

.tarefa-conteudo{
  flex:1;
  min-width:0;
}

.tarefa-horario{
  display:block;
  color:var(--vinho);
  font-size:12px;
  font-weight:bold;
  margin-bottom:3px;
}

.tarefa-texto{
  display:block;
  font-size:15px;
  line-height:1.35;
}

.tarefa-detalhes{
  margin-top:6px;
  padding-left:18px;
  color:#80686a;
  font-size:12px;
  line-height:1.55;
}

.concluida .tarefa-texto{
  text-decoration:line-through;
  opacity:.48;
}

.concluida .tarefa-horario{
  opacity:.48;
}

.status-dia{
  display:none;
  margin-top:12px;
  padding:9px;
  border-radius:12px;
  text-align:center;
  background:#edf3ed;
  color:var(--verde);
  font-size:13px;
  font-weight:bold;
}

.status-dia.visivel{
  display:block;
}

.resumo{
  margin-top:18px;
  background:var(--rosa-claro);
  border-radius:18px;
  padding:17px;
  text-align:center;
  color:var(--vinho);
}

.resumo strong{
  display:block;
  font-size:24px;
  margin:3px 0;
}

.barra{
  width:100%;
  height:10px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0 7px;
}

.barra span{
  display:block;
  height:100%;
  width:0;
  background:var(--rosa);
  border-radius:20px;
  transition:width .25s ease;
}

.notas{
  background:#fffaf4;
  border:1px solid #ead7ca;
  border-radius:20px;
  padding:17px;
  margin-top:18px;
  box-shadow:var(--sombra);
}

.notas h2{
  color:var(--vinho);
  font-size:19px;
  margin-bottom:10px;
}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  border:1px solid #e6cccc;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  background:white;
  color:var(--texto);
  outline:none;
}

.rodape{
  text-align:center;
  padding:8px 15px 25px;
  color:#8c6869;
  font-size:12px;
  line-height:1.5;
}

@media(max-width:480px){
  header h1{
    font-size:22px;
  }

  .topo{
    flex-direction:column;
  }

  .topo button{
    width:100%;
  }

  .tarefa-texto{
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🌸 Planner Semanal da Luziana</h1>
  <p>Uma rotina organizada, leve e feita com carinho.</p>
</header>

<main class="container">

<div class="topo">
  <button class="btn" id="hojeBtn">📅 Ir para hoje</button>
  <button class="btn-sec" id="limparBtn">🧹 Limpar concluídas</button>
</div>

<div class="semana" id="semanaTexto"></div>

<div id="planner"></div>

<section class="notas">
  <h2>📝 Minhas anotações</h2>

  <textarea
    id="notas"
    placeholder="Escreva aqui seus lembretes, ideias ou observações..."
  ></textarea>
</section>

<section class="resumo">
  <div>Progresso da semana</div>

  <strong id="progresso">0%</strong>

  <div class="barra">
    <span id="barraProgresso"></span>
  </div>

  <div id="contador">
    0 de 0 tarefas concluídas
  </div>
</section>

</main>

<footer class="rodape">
  Os quadradinhos são salvos neste aparelho e zerados automaticamente quando começa uma nova semana. 🌷
</footer>
