<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planner Semanal da Luziana</title>

<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#c9797f">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

<div class="logo">
<h1>Planner Semanal da Luziana</h1>
<span>Organize sua semana com leveza 🌷</span>
</div>

<button class="install-btn" id="installBtn">
Instalar App
</button>

</header>

<nav class="days-nav">

<button class="day active" data-day="capa">Capa</button>
<button class="day" data-day="segunda">Segunda</button>
<button class="day" data-day="terca">Terça</button>
<button class="day" data-day="quarta">Quarta</button>
<button class="day" data-day="quinta">Quinta</button>
<button class="day" data-day="sexta">Sexta</button>
<button class="day" data-day="historico">Histórico</button>

</nav>

<main id="app">

</main>
<script>

const paginas = {

capa: `
<div class="cover">
<img src="assets/cover.png" alt="Capa do Planner">
</div>
`,

segunda: `
segunda: `
<div class="planner">

<h2>🌷 Segunda-feira</h2>

<div class="percent">
0% concluído
</div>

<div class="progress">
<div class="progress-bar"></div>
</div>

<div class="task">
<label><input type="checkbox"><span>Acordar</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Higiene pessoal</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Café da manhã</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Arrumar a cama</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Meditar na Palavra</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Treino</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Banho</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Trabalho</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Jantar</span></label>
</div>

<div class="task">
<label><input type="checkbox"><span>Tempo livre</span></label>
</div>

</div>
`,

terca: `
<h2>🌷 Terça-feira</h2>
<p>Em construção...</p>
`,

quarta: `
<h2>🌷 Quarta-feira</h2>
<p>Em construção...</p>
`,

quinta: `
<h2>🌷 Quinta-feira</h2>
<p>Em construção...</p>
`,

sexta: `
<h2>🌷 Sexta-feira</h2>
<p>Em construção...</p>
`,

historico: `
<h2>📚 Histórico</h2>
<p>Em construção...</p>
`

};

const app = document.getElementById("app");

function abrirPagina(nome){

app.innerHTML = paginas[nome];

document.querySelectorAll(".day").forEach(botao=>{
botao.classList.remove("active");
});

const ativo = document.querySelector(`[data-day="${nome}"]`);

if(ativo){
ativo.classList.add("active");
}

}

document.querySelectorAll(".day").forEach(botao=>{

botao.addEventListener("click",()=>{

abrirPagina(botao.dataset.day);

});

});

abrirPagina("capa");
console.log("INDEX NOVO CARREGADO");
</script>

</body>

</html>
