<title>Planner Semanal da Luziana</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@500;600&display=swap');

:root{
--rose:#c9797f;
--wine:#7d3039;
--gold:#c28b36;
--cream:#fbf5ef
}

*{box-sizing:border-box}

html,body{
margin:0;
background:var(--cream);
color:#493338
}

body{
font-family:Montserrat,system-ui,sans-serif
}

.topbar{
position:sticky;
top:0;
z-index:20;
background:rgba(251,245,239,.96);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(194,139,54,.25);
padding:10px 12px 8px;
box-shadow:0 4px 18px rgba(80,45,45,.06)
}

.brand{
display:flex;
justify-content:space-between;
align-items:center;
max-width:1050px;
margin:auto;
gap:10px
}

.brand-title{
font-family:"Cormorant Garamond",serif;
color:var(--wine);
font-size:23px;
font-weight:700
}

.install{
display:none;
border:1px solid var(--gold);
background:#fffaf6;
color:var(--wine);
border-radius:999px;
padding:8px 12px;
font-weight:600;
font-size:12px
}

.tabs{
max-width:1050px;
margin:8px auto 0;
display:flex;
gap:6px;
overflow:auto;
scrollbar-width:none
}

.tabs::-webkit-scrollbar{
display:none
}

.day-tab{
flex:0 0 auto;
border:1px solid #e8cfc5;
background:#fffaf6;
color:#8c4a52;
border-radius:999px;
padding:7px 12px;
font-size:12px;
font-weight:600
}

.day-tab.active{
background:var(--rose);
color:#fff;
border-color:var(--rose)
}

main{
padding:16px 10px 30px
}

.page{
display:none;
max-width:1050px;
margin:auto
}

.page.active{
display:block
}

.page-art{
position:relative;
width:min(100%,1024px);
margin:auto;
line-height:0
}

.page-art img{
display:block;
width:100%;
height:auto;
border-radius:10px;
box-shadow:0 12px 35px rgba(79,42,42,.10)
}

.hitboxes{
position:absolute;
inset:0
}

.hitbox{
position:absolute;
transform:translate(-50%,-50%);
width:48px;
height:48px;
border:0;
border-radius:10px;
background:transparent;
cursor:pointer;
padding:0
}

.hitbox::after{
content:"";
position:absolute;
inset:6px;
border:2px solid transparent;
